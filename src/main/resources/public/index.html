<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SubtitleFlow | AI Video Studio</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0f172a',
                        cardBg: '#1e293b',
                        accent: '#6366f1',
                        accentHover: '#4f46e5'
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .font-mono-code { font-family: 'Fira Code', monospace; }
    </style>
</head>
<body class="bg-darkBg text-slate-100 min-h-screen flex items-center justify-center p-4">

<div class="w-full max-w-3xl bg-cardBg border border-slate-800 rounded-2xl shadow-2xl p-8 space-y-6">

    <!-- Header -->
    <div>
        <h1 class="text-3xl font-bold tracking-tight text-white flex items-center gap-2">
            Subtitle<span class="text-indigo-500">Flow</span>
        </h1>
        <p class="text-slate-400 text-sm mt-1">Automated AI Subtitle Generator for Video Content</p>
    </div>

    <!-- Main Configuration & URL Form -->
    <div class="space-y-4">
        <!-- URL Input with clear English placeholder -->
        <div class="space-y-2">
            <label for="videoUrl" class="block text-xs font-semibold uppercase tracking-wider text-slate-400">
                Video URL (YouTube, TikTok, Instagram)
            </label>
            <input type="text" id="videoUrl" placeholder="Paste video URL here (e.g. https://www.youtube.com/watch?v=...)"
                   class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/25 transition-all">
        </div>

        <!-- Settings Grid: Quality, Font Size, Color -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 pt-2">
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Video Quality</label>
                <select id="videoQuality" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500">
                    <option value="360p">SD 360p (Fastest)</option>
                    <option value="720p" selected>HD 720p (Balanced)</option>
                    <option value="best">Best Quality (Original)</option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Font Size</label>
                <select id="fontSize" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500">
                    <option value="18">Small (18px)</option>
                    <option value="24" selected>Medium (24px - Default)</option>
                    <option value="32">Large (32px)</option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Subtitle Color</label>
                <select id="fontColor" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500">
                    <option value="white">White (Classic)</option>
                    <option value="yellow">Yellow (Cinematic)</option>
                    <option value="green">Green</option>
                    <option value="red">Red</option>
                </select>
            </div>
        </div>

        <!-- Single Action Button -->
        <button id="processBtn" onclick="processVideo()"
                class="w-full mt-2 bg-indigo-600 hover:bg-indigo-500 active:scale-[0.98] text-white font-semibold py-3.5 rounded-xl shadow-lg shadow-indigo-600/20 transition-all cursor-pointer">
            Generate Subtitles & Open Editor
        </button>
    </div>

    <!-- Status Banner -->
    <div id="statusSection" class="hidden bg-slate-900/60 border border-slate-800 rounded-xl p-4 flex items-center justify-between">
        <div>
            <span class="text-xs text-slate-400 block uppercase tracking-wider">Process Status</span>
            <span id="statusText" class="text-sm font-medium text-amber-400">Waiting for action...</span>
        </div>
        <div class="text-right">
            <span class="text-xs text-slate-400 block uppercase tracking-wider">Session ID</span>
            <span id="videoId" class="text-xs font-mono-code text-indigo-400">-</span>
        </div>
    </div>

    <!-- Subtitle Editor -->
    <div id="editorSection" class="hidden space-y-3 pt-4 border-t border-slate-800">
        <div class="flex justify-between items-center">
            <label class="text-sm font-semibold text-slate-200">📝 Subtitle Editor (Review & Fix Timestamps/Text):</label>
            <span class="text-xs text-slate-400">Standard SRT Format</span>
        </div>
        <textarea id="subText" class="w-full h-80 bg-slate-900 border border-slate-700 rounded-xl p-4 text-sm font-mono-code text-sky-400 leading-relaxed focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 resize-y"></textarea>

        <button onclick="approveAndRender()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3.5 rounded-xl shadow-lg shadow-emerald-600/20 transition-all cursor-pointer">
            Burn Subtitles & Generate Final Video
        </button>
    </div>

    <!-- Final Success & Download -->
    <div id="finalSection" class="hidden space-y-5 pt-4 border-t border-slate-800 text-center py-6">
        <div class="inline-flex items-center justify-center w-14 h-14 bg-emerald-500/10 text-emerald-400 rounded-full mb-1 text-xl font-bold">
            ✓
        </div>
        <div>
            <h3 class="text-xl font-bold text-white">Video Successfully Generated!</h3>
            <p class="text-sm text-slate-400 mt-1">Your video with custom AI subtitles is ready for download.</p>
        </div>

        <div>
            <a id="downloadBtn" href="#" class="inline-flex items-center justify-center gap-2 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold px-8 py-3.5 rounded-xl shadow-lg shadow-emerald-600/20 transition-all cursor-pointer text-sm">
                ⬇ Download Final Video
            </a>
        </div>
    </div>

</div>

<script src="/script.js"></script>
</body>
</html>
